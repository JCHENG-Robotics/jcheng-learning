name: learning-ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-gate:
    name: learning-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        shell: bash
        run: python3 -m pip install --quiet 'uv==0.13.8'
      - name: Repository gate
        shell: bash
        run: bash scripts/check_repo_gate.sh
