schema: jcheng.learning.robot_adapter.v1
id: so101_follower
version: "1.0.0"
display_name: SO-101 Follower (public import only)

has_gripper: true
dof: 5
joints:
  - {name: shoulder_pan.pos,  index: 0, type: revolute, unit: deg, role: shoulder_pan}
  - {name: shoulder_lift.pos, index: 1, type: revolute, unit: deg, role: shoulder_lift}
  - {name: elbow_flex.pos,    index: 2, type: revolute, unit: deg, role: elbow_flex}
  - {name: wrist_flex.pos,    index: 3, type: revolute, unit: deg, role: wrist_flex}
  - {name: wrist_roll.pos,    index: 4, type: revolute, unit: deg, role: wrist_roll}

gripper:
  name: gripper.pos
  index: 5
  type: revolute
  unit: normalized
  space: normalized
  range_known: false

state_spaces:
  - id: so101_follower.joint_state.v1
    names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
    units: [deg, deg, deg, deg, deg, normalized]
    gripper: {name: gripper.pos, space: normalized}
    truth_allowed: [unknown]

action_spaces:
  - id: so101_follower.joint_position_absolute.v1
    kind: joint_position_absolute
    names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
    units: [deg, deg, deg, deg, deg, normalized]
    gripper: {name: gripper.pos, space: normalized}
    limits_known: false

cameras:
  - {key: up,   role: external, required: true, width: 640, height: 480, rate_hz: 30.0}
  - {key: side, role: wrist,    required: true, width: 640, height: 480, rate_hz: 30.0}

capabilities:
  mobile_base: false
  can_lift: false
  max_payload_kg: null
