schema: jcheng.learning.robot_adapter.v1
id: piper_x
version: "1.0.0"
display_name: Piper X

has_gripper: true
dof: 6
joints:
  - {name: joint1, index: 0, type: revolute, unit: rad, lower: -2.6179938, upper: 2.6179938, role: joint1}
  - {name: joint2, index: 1, type: revolute, unit: rad, lower: 0.0,        upper: 3.1415926, role: joint2}
  - {name: joint3, index: 2, type: revolute, unit: rad, lower: -2.9670597, upper: 0.0,       role: joint3}
  - {name: joint4, index: 3, type: revolute, unit: rad, lower: -1.553343,  upper: 1.553343,  role: joint4}
  - {name: joint5, index: 4, type: revolute, unit: rad, lower: -1.553343,  upper: 1.553343,  role: joint5}
  - {name: joint6, index: 5, type: revolute, unit: rad, lower: -2.88,      upper: 2.88,      role: joint6}

gripper:
  name: gripper
  index: 6
  type: prismatic
  unit: m
  space: linear
  closed: 0.0
  open: 0.1
  max_velocity_m_s: 0.05

state_spaces:
  - id: piper_x.joint_state.v1
    names: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]
    units: [rad, rad, rad, rad, rad, rad, m]
    gripper: {name: gripper, space: linear}
    truth_allowed: [measured, commanded]

action_spaces:
  - id: piper_x.joint_position_absolute.v1
    kind: joint_position_absolute
    names: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]
    units: [rad, rad, rad, rad, rad, rad, m]
    gripper: {name: gripper, space: linear}
    limits_known: true

cameras: []

capabilities:
  mobile_base: false
  can_lift: false
  max_payload_kg: null
